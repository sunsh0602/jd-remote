# 크롬 웹 화면 앞의 인증 프록시.
# 계정 파일은 jdownloader2 컨테이너의 webauth-htpasswd 그대로 → jdownloader2 에 로그인되는 계정이면 여기도 통과한다.
# 자체 비밀번호는 없다.
map $http_upgrade $connection_upgrade { default upgrade; '' close; }

server {
    listen 80;
    server_name _;

    auth_basic           "JDownloader";
    auth_basic_user_file /etc/nginx/htpasswd;   # 10-htpasswd.sh 가 /jd-htpasswd 에서 복사·동기화

    client_max_body_size 0;

    location / {
        proxy_pass http://jdr-browser:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600;
        proxy_send_timeout 3600;
        proxy_buffering off;
    }
}
